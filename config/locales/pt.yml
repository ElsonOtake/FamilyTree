  pages:
    about:
      title: "Ajuda e Guia"
      description: "Tudo o que você precisa para construir e explorar sua árvore genealógica."
      guide_heading: "Como usar o Family Tree"
      guide_search_title: "Buscar e navegar"
      guide_search_body: "Use a barra de busca na página Pessoas para encontrar alguém pelo nome — acentos e variações de romanização também são reconhecidos. Abra uma pessoa para ver pais, irmãos, cônjuges e filhos, e use os filtros para refinar por ano de nascimento, gênero e mais."
      guide_people_title: "Adicionar e editar pessoas"
      guide_people_body: "Membros conectados podem adicionar uma nova pessoa na página Pessoas. Abra uma pessoa para editar nome, kanji, foto, datas de nascimento e falecimento (datas parciais são aceitas) e observações."
      guide_relationships_title: "Casais e filhos"
      guide_relationships_body: "Na página de uma pessoa, adicione um cônjuge para criar um casal e depois adicione os filhos — uma pessoa nova ou alguém que já está na árvore. Os relacionamentos mantêm toda a árvore conectada."
      guide_favorites_title: "Favoritos"
      guide_favorites_body: "Toque no coração de qualquer pessoa para adicioná-la aos favoritos. Sua página inicial e a página de Aniversários mostram seus favoritos primeiro, deixando as pessoas importantes sempre a um clique."
      guide_birthdays_title: "Aniversários"
      guide_birthdays_body: "A página de Aniversários agrupa os aniversários próximos, de hoje e recentes, e mostra a idade que cada pessoa completa."
      guide_descendants_full_title: "Árvore de descendentes — completo (PDF)"
      guide_descendants_full_body: "Na página de uma pessoa, escolha 'Baixar descendentes completo (PDF)' para um gráfico de descendentes para impressão com cônjuges — cada casal unido e seus filhos abaixo, ordenados do mais velho ao mais novo por data de nascimento. Mostra quantas gerações você definir em Configurações da árvore (cinco por padrão), com retratos e anos de nascimento e falecimento."
      guide_descendants_title: "Árvore de descendentes (PDF)"
      guide_descendants_body: "Escolha 'Baixar descendentes (PDF)' para um gráfico apenas da linhagem — filhos, netos e além, sem cônjuges e sem limite de gerações. Os filhos aparecem do mais velho ao mais novo por data de nascimento."
      guide_ancestors_title: "Árvore de ascendentes (PDF)"
      guide_ancestors_body: "Na página de uma pessoa, escolha 'Baixar ascendentes (PDF)' para exportar um gráfico para impressão com pais, avós e além — todas as gerações de antepassados registradas, no mesmo estilo emoldurado."
      guide_tree_settings_title: "Configurações da árvore"
      guide_tree_settings_body: "Abra Configurações da árvore no menu para escolher quantas gerações a árvore de descendentes completo inclui (1–10, cinco por padrão) e se os pets da família aparecem nas árvores exportadas (ocultos por padrão)."
      guide_approval_title: "Acesso para novos membros"
      guide_approval_body: "Novas contas precisam da aprovação de um administrador antes de entrar. Depois de se registrar e confirmar seu e-mail, um administrador analisa sua solicitação e você recebe um e-mail assim que seu acesso for aprovado."
      guide_languages_title: "Idioma e aparência"
      guide_languages_body: "Alterne entre português, inglês e japonês pelo menu a qualquer momento e ative o modo escuro com o botão no canto. Sua preferência de idioma é salva no seu perfil."
      contact: "Fale conosco"
      contact_description: "Se você tiver dúvidas ou sugestões, entre em contato."
      contact_link: "Fale conosco"
    statistics:
